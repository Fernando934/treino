<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assessor de Corrida Pro - Strava</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #121212; 
      color: #fff; 
      text-align: center; 
      padding: 20px; 
      margin: 0;
    }
    h1 { 
      color: #fc4c02; 
      margin-bottom: 5px;
    }
    .subtitle {
      color: #888;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      max-width: 800px;
      margin: 0 auto;
    }
    .card { 
      background: #1e1e1e; 
      padding: 20px; 
      border-radius: 10px; 
      border-left: 5px solid #fc4c02; 
      text-align: left;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .card span {
      display: block;
      color: #aaa;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }
    .card h2 { 
      margin: 0; 
      font-size: 24px; 
      color: #fff; 
    }
    .status-container {
      margin-top: 30px;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #333;
      color: #bbb;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h1>⚡ ASSESSOR DE CORRIDA PRO</h1>
  <div class="subtitle">Plataforma Inteligente de Periodização e Análise Strava</div>

  <!-- CARTÕES DE MÉTRICAS -->
  <div class="metrics-grid">
    <div class="card">
      <span>DISTÂNCIA</span>
      <h2 id="distancia">0.00 km</h2>
    </div>

    <div class="card">
      <span>TEMPO TOTAL</span>
      <h2 id="tempo">00:00</h2>
    </div>

    <div class="card">
      <span>PACE MÉDIO</span>
      <h2 id="pace">--'--"</h2>
    </div>

    <div class="card">
      <span>VELOCIDADE MÉDIA</span>
      <h2 id="velocidade">0.0 km/h</h2>
    </div>
  </div>

  <!-- STATUS DE SINCRONIZAÇÃO -->
  <div class="status-container" id="conteudo-status">
    🔄 Aguardando sincronização GPS do Strava... Os dados aparecerão aqui automaticamente.
  </div>

  <script>
    async function carregarTreinos() {
      try {
        const res = await fetch('/api');
        const data = await res.json();
        
        if (data.sucesso && data.dados) {
          const { distancia, tempo, pace, velocidade, data: horaSinc } = data.dados;

          // Atualiza os valores nos cartões
          document.getElementById('distancia').innerText = distancia || '0.00 km';
          document.getElementById('tempo').innerText = tempo || '00:00';
          document.getElementById('pace').innerText = pace || '--\'--"';
          document.getElementById('velocidade').innerText = velocidade || '0.0 km/h';

          // Atualiza a barra de status se houver um treino válido
          const statusDiv = document.getElementById('conteudo-status');
          if (distancia && distancia !== "0.00 km") {
            statusDiv.innerHTML = `✅ Último treino sincronizado às <strong>${horaSinc || 'Agora'}</strong> | Distância: ${distancia} | Tempo: ${tempo}`;
          }
        }
      } catch (err) {
        console.error("Erro ao carregar dados:", err);
      }
    }

    // Carrega ao abrir e atualiza a cada 5 segundos em tempo real
    carregarTreinos();
    setInterval(carregarTreinos, 5000);
  </script>

</body>
</html>
